name: .NET

on:
  push:
    branches: [ master ]

  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Unfuck Git
      run: git config set --global core.autocrlf false

    - name: Clone
      uses: actions/checkout@v6

    - name: Restore
      run: dotnet restore --locked-mode

    - name: Pack DependencyHierarchy
      run: dotnet pack DependencyHierarchy --no-restore --configuration Release
    
    - name: Upload DependencyHierarchy
      uses: actions/upload-artifact@v7
      with:
        name: DependencyHierarchy.nupkg
        path: DependencyHierarchy/bin/Release/*.*nupkg
        if-no-files-found: error

    - name: Pack ProvidedDependencies
      run: dotnet publish ProvidedDependencies --no-restore --runtime win-x64 --configuration Release -p:PublishSingleFile=true --self-contained false

    - name: Upload ProvidedDependencies
      uses: actions/upload-artifact@v7
      with:
        name: ProvidedDependencies.exe
        path: ProvidedDependencies/bin/Release/net10.0/win-x64/publish/ProvidedDependencies.exe
        if-no-files-found: error

    - name: Pack WorkspaceResolution
      run: dotnet publish WorkspaceResolution --no-restore --runtime win-x64 --configuration Release -p:PublishSingleFile=true --self-contained false

    - name: Upload WorkspaceResolution
      uses: actions/upload-artifact@v7
      with:
        name: WorkspaceResolution.exe
        path: WorkspaceResolution/bin/Release/net10.0/win-x64/publish/WorkspaceResolution.exe
        if-no-files-found: error