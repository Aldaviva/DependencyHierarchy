name: .NET

on:
  push:
    branches: [ master ]

  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Unfuck Git
      run: git config set --global core.autocrlf false

    - name: Clone
      uses: actions/checkout@v6

    - name: Restore
      run: dotnet restore --locked-mode

    - name: Pack DependencyHierarchy
      run: dotnet pack DependencyHierarchy --configuration Release

    - name: Pack ProvidedDependencies
      run: dotnet publish ProvidedDependencies --runtime win-x64 --configuration Release -p:PublishSingleFile=true --self-contained false

    - name: Pack WorkspaceResolution
      run: dotnet publish WorkspaceResolution --runtime win-x64 --configuration Release -p:PublishSingleFile=true --self-contained false

    - name: Upload DependencyHierarchy package
      uses: actions/upload-artifact@v7
      with:
        name: DependencyHierarchy.nupkg
        path: DependencyHierarchy/bin/Release/*.*nupkg
        if-no-files-found: error

    - name: Upload ProvidedDependencies
      uses: actions/upload-artifact@v7
      with:
        name: ProvidedDependencies.exe
        path: ProvidedDependencies/bin/Release/net10.0/win-x64/publish/ProvidedDependencies.exe
        if-no-files-found: error

    - name: Upload package
      uses: actions/upload-artifact@v7
      with:
        name: DependencyHierarchy.exe
        path: DependencyHierarchy/bin/Release/net10.0/win-x64/DependencyHierarchy.exe
        if-no-files-found: error